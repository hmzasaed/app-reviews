[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playstore-review-analysis"
version = "0.1.0"
description = "AI-powered Play Store review intelligence: reported issues, clusters, priorities."
requires-python = ">=3.10"
dependencies = [
    # API + storage
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    # Collection + data
    "google-play-scraper>=1.2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "langdetect>=1.0.9",
    # NLP / ML
    "torch>=2.3",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.4",
    "umap-learn>=0.5.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
reviews = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*", "database*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
