# The database is Supabase (external), configured through DATABASE_URL in .env.
services:
  backend:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - hf-models:/models  # cache downloaded Hugging Face models between restarts
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hf-models:
